name: Alerte quotidienne

on:
  schedule:
    # Lundi-vendredi à 17:00 UTC (après la clôture d'Euronext), le cron GitHub est en UTC
    - cron: "0 17 * * 1-5"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Afficher l'e-mail dans les logs sans l'envoyer"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  alert:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-alert.txt
      - run: pip install -r requirements-alert.txt
      - name: Envoyer l'alerte
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then python auto_alert.py --dry-run; else python auto_alert.py; fi
